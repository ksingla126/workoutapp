<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<style>
#authGate{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:24px 18px;background:var(--bg,#EDF0F4);color:var(--ink,#0E1626);font-family:var(--body,system-ui,sans-serif)}
#authGate[hidden]{display:none}
#authGate .ag-card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
#authGate .ag-mark{width:60px;height:66px;clip-path:polygon(50% 0,100% 24%,100% 76%,50% 100%,0 76%,0 24%);background:linear-gradient(155deg,#8F8BFF,#4B48E8 55%,#2F2CB8);color:#fff;display:grid;place-items:center;font:900 24px var(--display,system-ui);margin-bottom:6px}
#authGate h1{margin:4px 0 0;font:800 38px/1.05 var(--display,system-ui);letter-spacing:-.02em}
#authGate .ag-sub{margin:0 0 8px;color:var(--muted,#5F6B7E)}
#authGate label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted,#5F6B7E)}
#authGate input{font:16px var(--body,system-ui);padding:13px 14px;border-radius:12px;border:1px solid var(--line,#E1E5EC);background:var(--surface,#fff);color:var(--ink,#0E1626)}
#authGate input:focus{outline:none;border-color:var(--gym,#4B48E8);box-shadow:0 0 0 3px color-mix(in srgb,var(--gym,#4B48E8) 22%,transparent)}
#authGate button{font:700 16px var(--body,system-ui);padding:13px;border-radius:999px;border:0;background:var(--ink,#0E1626);color:var(--bg,#EDF0F4);cursor:pointer}
#authGate button:disabled{opacity:.5}
#authGate .ag-ghost{background:transparent;color:var(--ink,#0E1626);border:1px solid var(--line,#E1E5EC)}
#authGate .ag-link{background:none;color:var(--muted,#5F6B7E);font-size:14px;padding:4px;font-weight:600}
#authGate .ag-msg{min-height:1.2em;margin:0;font-size:14px;color:var(--bad,#E0402A)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/platform.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Semi+Condensed:wght@600;700;800;900&display=swap">
<style>
/* Layout: phone-first single column (max 640px) with a fixed bottom tab bar; competition-plate colors mark gym / run / food / advice. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F4F6F9; --line:#E1E5EC; --ink:#0E1626; --muted:#5F6B7E;
  --gym:#4B48E8; --run:#EE4F2A; --food:#0F9D57; --coach:#C98A06;
  --gym-soft:#ECEBFD; --run-soft:#FDEBE6; --food-soft:#E3F5EB; --coach-soft:#FBF1DC;
  --good:#0F9D57; --warn:#C98A06; --bad:#E0402A;
  --display:"Barlow Semi Condensed","Barlow","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px; --r2:14px; --edge:transparent;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1120; --surface:#151B2D; --surface-2:#1C2337; --line:#283049; --ink:#ECEFF7; --muted:#97A1B8;
  --gym:#8F8BFF; --run:#FF7B57; --food:#3DD68C; --coach:#F4C452;
  --gym-soft:#232450; --run-soft:#3A2224; --food-soft:#12332A; --coach-soft:#38301A;
  --good:#3DD68C; --warn:#F4C452; --bad:#FF6B57; --edge:#222A40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1120; --surface:#151B2D; --surface-2:#1C2337; --line:#283049; --ink:#ECEFF7; --muted:#97A1B8;
  --gym:#8F8BFF; --run:#FF7B57; --food:#3DD68C; --coach:#F4C452;
  --gym-soft:#232450; --run-soft:#3A2224; --food-soft:#12332A; --coach-soft:#38301A;
  --good:#3DD68C; --warn:#F4C452; --bad:#FF6B57; --edge:#222A40; color-scheme:dark}

html,body{height:100%}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-y:none}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:14px 110px}
h1,h2,h3{font-family:var(--display);letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:800;}
h2{font-size:22px;font-weight:700;}
h3{font-size:18px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:700;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.plate{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.p-gym{background:var(--gym)} .p-run{background:var(--run)} .p-food{background:var(--food)} .p-coach{background:var(--coach)} .p-rest{background:var(--line)} .p-ink{background:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.gym{background:var(--gym-soft);color:var(--gym);border-color:transparent}
.chip.run{background:var(--run-soft);color:var(--run);border-color:transparent}
.chip.food{background:var(--food-soft);color:var(--food);border-color:transparent}
.chip.coach{background:var(--coach-soft);color:var(--coach);border-color:transparent}
.link{background:none;border:none;padding:0;font:inherit;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* header */
.top{display:flex;flex-direction:column;gap:6px;padding-block:6px 4px}
.countdown{display:flex;gap:18px;flex-wrap:wrap}
.stat .v{font-family:var(--display);font-size:28px;font-weight:800;line-height:1}
.stat .l{font-size:11px;font-weight:700;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink)}
.bar.food>i{background:var(--food)} .bar.over>i{background:var(--warn)}

/* glance */
.glance{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.g .v{font-family:var(--display);font-size:24px;font-weight:800;line-height:1}
.g .v small{font-size:14px;color:var(--muted);font-weight:700}
.g .l{font-size:11px;font-weight:700;color:var(--muted)}

/* week strip */
.strip{display:grid;grid-template-columns:auto repeat(7,1fr) auto;gap:4px;align-items:stretch}
.strip button.d{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;min-width:0}
.strip button.d .w{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.strip button.d .n{font-family:var(--display);font-size:18px;font-weight:700;line-height:1}
.strip button.d.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.strip button.d.today .n{text-decoration:underline;text-underline-offset:3px}
.strip button.d .plate{width:8px;height:8px;opacity:.35}
.strip button.d.done .plate{opacity:1}
.strip button.d:disabled{opacity:.35;cursor:default}
.arrow{border:none;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 4px}
.arrow:disabled{opacity:.25}

/* session */
.ex{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:none;padding-top:0}
.ex .name{font-weight:700}
.target{font-size:13px;color:var(--gym);font-weight:600}
.target.first{color:var(--muted);font-weight:500}
.target.stall{color:var(--warn)}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.set.done{background:var(--food-soft);border-color:var(--food)}
.chk{flex:none;width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:transparent;font-weight:800;font-size:15px;cursor:pointer;display:grid;place-items:center;padding:0}
.chk.on{background:var(--food);border-color:var(--food);color:var(--surface)}
.dbt{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--muted);padding:3px 8px;border:1px solid var(--line);border-radius:999px;cursor:pointer}
.dbt input{width:15px;height:15px;accent-color:var(--gym);margin:0}
.dbt.on{color:var(--gym);border-color:var(--gym);background:var(--gym-soft)}
.prev{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.prev .pl{font-size:11px;font-weight:800;color:var(--muted);margin-right:2px}
.pill{font-variant-numeric:tabular-nums;font-weight:600;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:1px 7px}
.cnote{display:flex;flex-direction:column;gap:4px;background:var(--coach-soft);border-radius:9px;padding:8px 10px;font-size:13px}
.cnote .ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cnote .who{font-size:11px;font-weight:800;color:var(--coach)}
.mode{font-size:11px;font-weight:800;letter-spacing:.04em;padding:1px 8px;border-radius:999px;background:var(--surface);color:var(--ink)}
.mode.add_weight{color:var(--good)} .mode.deload{color:var(--bad)} .mode.hold{color:var(--muted)}
.cnote.rule{background:var(--surface-2)} .cnote.rule .who{color:var(--muted)}
.lastnote{font-size:13px;background:var(--surface-2);border-radius:9px;padding:8px 10px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.seg.two{grid-template-columns:1fr 1fr}
.seg.three{grid-template-columns:repeat(3,1fr)}.seg.four{grid-template-columns:repeat(4,1fr)}
.scanbox{min-height:180px;border-radius:12px;overflow:hidden;background:#000;display:grid;place-items:center;color:#fff;padding:8px}.scanbox video{width:100%!important;border-radius:8px}
.ntp{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;justify-content:flex-end}
.mrow .ntp .tchip{font-size:9.5px;padding:2px 6px;letter-spacing:.02em}
.mrow .mtop{grid-template-columns:auto 1fr 14px}
.ntp .arrow{color:var(--muted);font-weight:800}
.races{display:flex;flex-direction:column}
.race{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.race:first-child{border-top:none}
.race .rn{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.race .rt{display:flex;flex-direction:column;align-items:flex-end}
.race .rt b{font-family:var(--display);font-size:22px;line-height:1.05}
.mode{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px}
.mode.run{background:var(--food-soft);color:var(--food)} .mode.rw{background:var(--coach-soft);color:var(--coach)} .mode.walk{background:var(--surface-2);color:var(--muted)}
.seg button{font:inherit;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 0;border-radius:9px;border:none;background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.poses{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:3px;background:var(--surface-2);border-radius:10px}
.poses button{font:inherit;font-weight:700;font-size:13px;padding:7px 0;border:none;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}
.poses button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.pair img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:9px;background:var(--surface-2)}
.pair figcaption{font-size:12px;color:var(--muted);font-weight:600}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.thumbs button{flex:none;border:2px solid transparent;border-radius:9px;padding:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:11px;color:var(--muted)}
.thumbs button.on{border-color:var(--ink)}
.thumbs img{width:56px;height:74px;object-fit:cover;border-radius:7px;display:block}
.pa{display:flex;flex-direction:column;gap:8px}
.pa .grp{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border-left:4px solid var(--line)}
.pa .grp.up{border-left-color:var(--good)} .pa .grp.down{border-left-color:var(--bad)} .pa .grp.same{border-left-color:var(--muted)}
.pa .grp b{font-size:11px;}
.pa .grp.up b{color:var(--good)} .pa .grp.down b{color:var(--bad)} .pa .grp.same b{color:var(--muted)}
.pa ul{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.pct{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pct .n{font-family:var(--display);font-size:56px;font-weight:800;line-height:.9}
.pct .n.tier{font-size:40px;line-height:1}
.tscale{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.tscale button{font:inherit;font-size:10.5px;font-weight:800;text-align:center;padding:6px 2px;border-radius:6px;border:none;background:var(--surface-2);color:var(--muted);line-height:1.15;cursor:pointer}
.tscale span{font-size:10.5px;font-weight:800;text-align:center;padding:6px 2px;border-radius:6px;background:var(--surface-2);color:var(--muted);line-height:1.15}
.pct .u{font-size:13px;color:var(--muted);font-weight:600}
.pbar{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--run-soft),var(--coach-soft) 50%,var(--food-soft))}
.pbar i{position:absolute;top:-4px;width:4px;height:20px;border-radius:2px;background:var(--ink);transform:translateX(-2px)}
.pbar b{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.pticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.conf{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.conf.hi{color:var(--good)} .conf.lo{color:var(--warn)}
.basis{font-size:13px;display:flex;flex-direction:column;gap:3px}
.basis .k{color:var(--muted)}
.goals{display:flex;flex-direction:column;gap:3px;font-size:13px;font-variant-numeric:tabular-nums}
.goals div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:4px}
.srcs a{color:var(--ink)}
.mus{display:flex;flex-direction:column}
.mrow{display:flex;flex-direction:column;gap:5px;padding:11px 2px;border:none;border-top:1px solid var(--line);background:none;width:100%;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.mrow:hover{background:var(--surface-2)}
.mfoot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.mfoot .chev{font-size:18px;line-height:1}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-height:82vh;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet-grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet-x{font:inherit;font-size:16px;border:none;background:var(--surface-2);color:var(--ink);width:34px;height:34px;border-radius:50%;cursor:pointer}
.sheet-tier{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.exl{display:flex;flex-direction:column;gap:10px}
.exr{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;background:var(--surface-2)}
.exh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tchip{font-size:11px;font-weight:800;color:var(--bg);padding:3px 9px;border-radius:999px;white-space:nowrap}
.exm{font-size:13px}
.tgt{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.1}
.ok{color:var(--good);font-weight:700}
.imp{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:13px}
.impbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.impbar i{display:block;height:100%;background:var(--ink)}
.mrow:first-child{border-top:none}
.mtop{display:grid;grid-template-columns:1fr auto 14px;gap:10px;align-items:center}
.mtop .chev{color:var(--muted);font-size:20px;line-height:1}
.mshare{font-size:12px;color:var(--muted)}
.mp{font-family:var(--display);font-size:17px;font-weight:800;text-align:right;white-space:nowrap}
.mbar{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--gym)}
.mex{font-size:12px;color:var(--muted)}
.runrow{display:grid;grid-template-columns:1fr auto 18px;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:none;border-top:1px solid var(--line);padding:11px 2px;color:var(--ink);font:inherit;cursor:pointer}
.runrow:first-child{border-top:none}
.runrow:hover{background:var(--surface-2)}
.runrow .rd{display:flex;flex-direction:column;min-width:0;gap:2px}
.runrow .rd .tags{display:flex;gap:5px;flex-wrap:wrap}
.runrow .rm{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums}
.runrow .rm b{font-family:var(--display);font-size:20px;line-height:1.05}
.runrow .chev{color:var(--muted);font-size:20px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.zbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.zbar i{display:block;height:100%}
.zgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-size:12px;font-variant-numeric:tabular-nums}
.zgrid div{display:flex;flex-direction:column;gap:1px}
.zgrid b{font-size:13px}
.ivs{display:flex;flex-direction:column;gap:3px;font-size:13px;font-variant-numeric:tabular-nums}
.iv{display:grid;grid-template-columns:62px 54px 1fr 70px;gap:8px;align-items:center}
.iv .k{font-weight:700} .iv.walk .k{color:var(--muted)} .iv.run .k{color:var(--run)}
.iv .x{color:var(--muted);text-align:right}
.strip2{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.strip2 i{display:block;height:100%}
.cmp{width:100%}
.cmp td:not(:first-child),.cmp th:not(:first-child){text-align:right}
.better{color:var(--good);font-weight:700} .worse{color:var(--bad);font-weight:700}
.importer{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px dashed var(--line);border-radius:10px}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.stv{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.stv>div{background:var(--surface-2);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.stv .l{font-size:10px;font-weight:800;color:var(--muted)}

function saveProfile(){clearTimeout(profTimer); profTimer=setTimeout(()=>{ profTimer=null; if(mode!=="db"){ saveLocal(); return }
  const full=JSON.parse(JSON.stringify(S.profile)), core={...full}; PART_KEYS.forEach(k=>delete core[k]);
  const put=(name,ref,data)=>{ const st=JSON.stringify(data); if(partStamp[name]===st) return; partStamp[name]=st; (partSent[name]=partSent[name]||[]).push(canonJSON(data)); if(partSent[name].length>20) partSent[name].shift(); enqueue(name,()=>ref.set(data)) };
  put("profile",refs.profile,core);
  Object.entries(PARTS).forEach(([name,keys])=>{ if(!refs[name]) return; const d={}; keys.forEach(k=>{ if(full[k]!==undefined) d[k]=full[k] }); put(name,refs[name],d) });
},500)}
function saveChat(){ if(mode==="db") enqueue("chat",()=>refs.chat.set({messages:S.chat.slice(-60)})); else saveLocal(); }
function saveAdvice(){ if(mode==="db") enqueue("advice",()=>refs.advice.set(JSON.parse(JSON.stringify(S.advice)))); else saveLocal(); }

async function boot(){
  loadLocal(); render();
  const c=window.claude;
  if(!c||!c.use){ userReady=true; loaded.logs=loaded.advice=true; render(); return }
  const sp=c.use("sample").then(f=>{sampleFn=f; setTimeout(maybeOverload,500); if(f&&f.limits) f.limits().then(l=>{imgOK=!!(l&&l.images); imgMax=(l&&l.images&&l.images.maxCount)||4; render(true)}).catch(()=>{}); render(true); maybeAutoAdvice()}).catch(()=>{});
  try{
    const [db,user]=await Promise.all([c.use("db"),c.use("user")]);
    const uid = user? await user.id() : null;
    if(db && uid){
      const base="data/users/"+uid;
      refs={profile:db.doc(base+"/profile"),chat:db.doc(base+"/chat"),advice:db.doc(base+"/advice"),plan:db.doc(base+"/plan"),kitchen:db.doc(base+"/kitchen"),prefs:db.doc(base+"/prefs"),inbox:db.doc(base+"/inbox"),ranks:db.doc(base+"/ranks")};
      refs.logs=refs.profile.collection("logs"); refs.meals=refs.profile.collection("meals"); refs.over=refs.profile.collection("overload");
      refs.photos=refs.profile.collection("photos");
      refs.photos.onSnapshot(snap=>{const P={}; snap.docs.forEach(d=>{if(d.exists) P[d.id]=d.data()}); S.photos=P; if(tab==="progress"&&progView==="body") render(true)},()=>{});
      refs.over.onSnapshot(snap=>{const O={}; snap.docs.forEach(d=>{if(d.exists) O[d.id]=d.data()}); S.over=O; S.__overLoaded=true; render(true); maybeOverload()},()=>{S.__overLoaded=true});
      mode="db"; S.logs={}; S.meals={}; S.chat=[];
      refs.logs.onSnapshot(snap=>{const L={}; snap.docs.forEach(d=>{if(d.exists) L[d.id]=d.data()}); S.logs=L; loaded.logs=true; migrateTiltCalf(); maybeStravaInit(); render(true); maybeAutoAdvice()},()=>{});
      refs.meals.onSnapshot(snap=>{const M={}; snap.docs.forEach(d=>{if(d.exists) M[d.id]={...d.data()}}); for(const k in mealTimers){ if(S.meals[k]) M[k]=S.meals[k] } S.meals=M; render(true)},()=>{});
      // profile + its parts: the app waits for all four before deciding what to show
      const got=new Set(), partVals={}, need=["profile",...Object.keys(PARTS)];
      const settle=()=>{ if(!loaded.profile&&need.every(n=>got.has(n))){ loaded.profile=true } if(loaded.profile){ onProfile(); render(true) } };
      refs.profile.onSnapshot(d=>{ const keep={}; PART_KEYS.forEach(k=>{ if(S.profile[k]!==undefined) keep[k]=S.profile[k] });
        if(d.exists){ const p=d.data(); S.profile={about:"",raceDate:"",weights:[],grocery:{},...keep,...p}; Object.values(partVals).forEach(v=>Object.assign(S.profile,v)) }
        else if(!got.has("profile")){ S.profile={about:"",raceDate:"",weights:[],grocery:{},...keep} }
        got.add("profile"); settle() },()=>{got.add("profile"); settle()});
      Object.keys(PARTS).forEach(name=>refs[name].onSnapshot(d=>{ if(d.exists){ const data=d.data(); partVals[name]=data;
        // skip the echo of one of our own older saves (a newer one is on its way) and anything that would undo an unsaved local edit
        const c=canonJSON(data), sent=partSent[name]||[], stale=sent.includes(c)&&c!==sent[sent.length-1];
        if(!stale&&!profTimer) Object.assign(S.profile,data) } got.add(name); settle() },()=>{got.add(name); settle()}));
      refs.chat.onSnapshot(d=>{ if(d.exists && !sending){S.chat=(d.data().messages||[]).slice(); if(tab==="advice") renderChatList()} },()=>{});
      refs.advice.onSnapshot(d=>{ if(d.exists && !adviceBusy){S.advice={items:[],stamp:"",at:0,seenAt:0,history:[],...d.data()}} loaded.advice=true; render(true); maybeAutoAdvice()},()=>{loaded.advice=true});
    } else {loaded.logs=loaded.advice=loaded.profile=true}
  }catch(e){loaded.logs=loaded.advice=loaded.profile=true}
  userReady=true; render(true); await sp;
}

/* ---------- Progressive overload ---------- */
function exHistory(exId, beforeKey){
  return Object.entries(S.logs).filter(([k,l])=>l.type==="gym" && k<beforeKey && l.ex && WS(l.ex[exId]).length)
    .sort((a,b)=>a[0]<b[0]?1:-1).map(([k,l])=>({k,sets:WS(l.ex[exId])}));
}
function targetFor(ex, key){
  if(ex.fixed) return {w:null,reps:Array(ex.sets).fill(ex.lo),msg:`${ex.sets} rounds × ${ex.lo>=60?ex.lo/60+" min":ex.lo+" s"}, ${ex.rest} s rest. Format steps up every 2 weeks.`};
  const h=exHistory(ex.id,key);
  if(!h.length) return {first:true,msg: ex.bw? `Start: hold ${ex.lo}s × ${ex.sets}` : `First session: pick a weight you can lift ${ex.lo}× with ~2 reps left. Log it.`, w:null, reps:Array(ex.sets).fill(ex.lo)};
  const last=h[0].sets, w=Number(last[0].w)||0;
  const lastTxt = ex.bw? last.map(s=>s.r+"s").join(", ") : `${w} × ${last.map(s=>s.r).join(", ")}`;
  if(ex.bw){
    const reps=Array.from({length:ex.sets},(_,i)=>Math.min(ex.hi,(Number(last[i]?.r)||ex.lo)+5));
    const maxed=last.length>=ex.sets && last.every(s=>Number(s.r)>=ex.hi);
    return {w:null,reps,last:lastTxt,msg: maxed? "Maxed at 60s: add a plate on your back or go to a harder variation" : "+5 s per set"};
  }
  const allTop = last.length>=ex.sets && last.slice(0,ex.sets).every(s=>Number(s.r)>=ex.hi);
  if(allTop) return {w:w+incU(ex.inc),reps:Array(ex.sets).fill(ex.lo),last:lastTxt,msg:`Add ${incTxt(ex.inc)} — you hit ${ex.hi} on every set`};
  if(h[1]){
    const prev=h[1].sets, pw=Number(prev[0].w)||0, sum=a=>a.reduce((t,s)=>t+(Number(s.r)||0),0);
    if(pw===w && sum(last)<=sum(prev)) return {w:deloadW(ex,w),reps:Array(ex.sets).fill(ex.lo),last:lastTxt,stall:true,msg:"Stalled twice: drop ~10% and build back up"};
  }
  const reps=Array.from({length:ex.sets},(_,i)=>Math.min(ex.hi,(Number(last[i]?.r)||ex.lo)+1));
  return {w,reps,last:lastTxt,msg:"Same weight, beat last time by a rep"};
}
const e1rm=(w,r)=>w*(1+r/30);
const WS=a=>(a||[]).filter(x=>x&&x.t!=="w"); // working sets: warm-ups never count toward progress, PRs or standings

/* ---------- Food math ---------- */
function dayEaten(k){
  const m=S.meals[k]; if(!m) return {kcal:0,p:0,any:false};
  let kcal=0,p=0; Object.entries(m.eaten||{}).forEach(([id,v])=>{if(v&&MEALS[id]){kcal+=MEALS[id].kcal;p+=MEALS[id].p}});
  (m.extras||[]).forEach(x=>{kcal+=Number(x.kcal)||0;p+=Number(x.p)||0});
  (m.items||[]).forEach(x=>{kcal+=Number(x.kcal)||0;p+=Number(x.p)||0});
  return {kcal,p,any:kcal>0};
}
function weekFood(w){
  const mon=monOf(w); let eaten=0,target=0,protein=0,daysLogged=0;
  for(let i=0;i<7;i++){const d=addDays(mon,i); if(!inProgram(d)) continue; target+=dayTarget(d); const e=dayEaten(ymd(d)); eaten+=e.kcal; protein+=e.p; if(e.any) daysLogged++}
  return {eaten,target,protein,daysLogged};
}

/* ---------- Rendering ---------- */
const $=s=>document.querySelector(s);
function toast(t){const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,1800)}
let lastRenderKey="";
function render(fromStore){
  const key=tab+"|"+ymd(sel);
  const typing=document.activeElement && document.activeElement.closest && document.activeElement.closest("#view") && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(fromStore && key===lastRenderKey && (typing || (tab==="home" && document.querySelector("#trainLog[open]")) || (tab==="home" && hasDraft(ymd(sel),TRAIN_RE)))){ renderTop(); renderTabs(); return }
  if(fromStore && tab==="advice" && key===lastRenderKey && (sending||typing)){ renderTop(); renderTabs(); return }
  if(fromStore && tab==="ranks" && key===lastRenderKey && typeof rkTrialOpen!=="undefined" && rkTrialOpen){ renderTop(); renderTabs(); return } // don't wipe a half-filled time trial
  const openLogger=!!document.querySelector("#trainLog[open]") && key===lastRenderKey;
  if(TM.start&&S.logs[TM.date]) stopWorkout(); // a logged workout can only be edited, not run live
  if(gateView(fromStore)) return;
  lastRenderKey=key;
  renderTop(); renderTabs();
  const v=$("#view");
  v.innerHTML = tab==="home"?viewHome(openLogger): tab==="plan"?planSwitch()+(planView==="food"?viewFood():viewPlan()): tab==="progress"?viewProgress(): tab==="ranks"?viewRanks(): advSwitch()+(advView==="outlook"?viewOutlook():viewAdvice());
  applyDrafts();
  bind(); if(tab==="ranks") bindRanks();
  setTimeout(maybeOverload,0); setTimeout(rankNotify,0);
}
function renderTop(){

  const left=Math.max(0,Math.round((GOAL-today)/DAYMS));
  const plannedSoFar=countPlanned(today), done=Object.keys(S.logs).filter(k=>parseYmd(k)<=today&&parseYmd(k)>=countStart()).length;

  $("#top").innerHTML=`<div class="top-row"><span class="top-name">${esc(progName())}</span><span class="top-act">${typeof rankChip==="function"?rankChip():""}${accountBtn()}</span></div>

function countStart(){ if(!CUSTOM||!CUSTOM.su.firstDay) return START; let k=CUSTOM.su.firstDay; Object.keys(S.logs).forEach(x=>{if(x<k) k=x}); const d=parseYmd(k); return d>START?d:START }
function countPlanned(upTo){let n=0;for(let d=new Date(countStart());d<=upTo&&d<=GOAL;d=addDays(d,1)){const p=planFor(d); if(p&&p.type!=="rest") n++}return n}
function unseenAdvice(){return S.advice.at>(S.advice.seenAt||0)?(S.advice.items||[]).length:0}
const TAB_ICON=(()=>{ const sv=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;

function renderTabs(){

function weekStrip(){
  const mon=monOf(weekOf(sel));
  let h=`<div class="strip"><button class="arrow" data-wk="-1" aria-label="Previous week" ${weekOf(sel)<=1?"disabled":""}>‹</button>`;
  for(let i=0;i<7;i++){const d=addDays(mon,i), p=planFor(d), k=ymd(d);
    const cls=["d",k===ymd(sel)?"sel":"",k===ymd(today)?"today":"",S.logs[k]?"done":""].join(" ");
    const pc=!p?"p-rest":p.type==="gym"?"p-gym":p.type==="run"?"p-run":"p-rest";
    h+=`<button class="${cls}" data-day="${k}" ${p?"":"disabled"}><span class="w">${DOW[i]}</span><span class="n num">${d.getDate()}</span><span class="plate ${pc}"></span></button>`}
  h+=`<button class="arrow" data-wk="1" aria-label="Next week" ${weekOf(sel)>=WEEKS?"disabled":""}>›</button></div>`;
  return h;
}

function viewHome(openLogger){
  const p=planFor(sel), k=ymd(sel), log=S.logs[k];
  const isToday=k===ymd(today);

  if(mode==="local" && userReady && !window.__platform) h+=`<p class="note">Entries stay in this browser only.</p>`;
  if(p && midnight(today)>GOAL && k===ymd(GOAL)) h+=`<div class="card"><h2>Finish line</h2><p>Your ${WEEKS}-week block ended ${fmtDate(GOAL)}. ${CUSTOM?`<button class="btn ghost sm" type="button" data-su-edit="1">Build your next plan</button>`:"Ask your coach to plan the next block."}</p></div>`;
  if(!p){return h+`<div class="card"><h2>Finish line</h2><p>Your ${WEEKS}-week block ended ${fmtDate(GOAL)}. Check Progress for your numbers, then ${CUSTOM?`<button class="btn ghost sm" type="button" data-su-edit="1">build your next plan</button>`:"ask your coach to plan the next block."}</p></div>`}
  // glance
  const e=dayEaten(k), tgt=dayTarget(sel), ptg=dayProtein(sel), wf=weekFood(p.w);
  const pctW=Math.min(100,wf.target?wf.eaten/wf.target*100:0);
  h+=`<div><div class="eyebrow" style="margin-bottom:6px">${isToday?"Today":"Day view"} · ${fmtDate(sel)} · Week ${p.w}${p.moved?(p.src?` · moved from ${DOW[dowOf(parseYmd(p.src))]}`:" · rest day (schedule shifted)"):""}${RUNS[p.w-1].tag?" · "+esc(RUNS[p.w-1].tag):""}</div>
   <div class="glance">
    <div class="g"><div class="l">Calories today</div><div class="v num">${fmtN(e.kcal)}<small> / ${fmtN(tgt)}</small></div><div class="bar food ${e.kcal>tgt?"over":""}"><i style="width:${Math.min(100,e.kcal/tgt*100)}%"></i></div></div>
    <div class="g"><div class="l">Protein today</div><div class="v num">${Math.round(e.p)}<small> / ${ptg} g</small></div><div class="bar food"><i style="width:${Math.min(100,e.p/ptg*100)}%"></i></div></div>
    <div class="g"><div class="l">Calories this week</div><div class="v num">${fmtN(wf.eaten)}<small> / ${fmtN(wf.target)}</small></div><div class="bar food ${wf.eaten>wf.target?"over":""}"><i style="width:${pctW}%"></i></div></div>

function trainingCard(p,k,log,openLogger){
  if(p.type==="rest") return `<div class="card"><div class="row between"><h2>Rest day</h2><span class="chip">Recovery</span></div><p>Walk 20–30 minutes if you feel like it, stretch hips and calves, and do Sunday meal prep (Plan → Food).</p>${dayMenu(p,k,log)}${stravaChooser(k,log)}${extraRunsBlock(k,log)}${weekResetBtn(k)}${mondayWeighIn()}</div>`;
  if(p.type==="gym"&&!(p.ex&&p.ex.length)) return `<div class="card"><div class="eyebrow">Gym</div><h2>${esc(p.name)}</h2><p>This routine has no exercises yet.</p><button type="button" class="btn sm" data-c-gotoplan="1">Add exercises</button></div>`;

    let h=`<div class="card gymcard"><div class="row between"><div><div class="eyebrow">Gym · ~${CUSTOM?estMin(p.ex):"55–60"} min</div><h2>${esc(p.name)}</h2></div>${log?`<span class="chip gym">Logged ✓${log.durMin?` · ${Math.round(log.durMin)} min`:""}${log.prs&&log.prs.length?` · ${log.prs.length} PR${log.prs.length>1?"s":""}`:""}</span>`:""}</div>`;

      if(grp.length>1){ ssN++; h+=`<div class="ssgroup"><div class="sslabel">Superset ${String.fromCharCode(64+ssN)} · alternate sets, rest after the last one</div>` }

    return h;

  const prevTxt = prev&&prev.mi? `Last time (${fmtShort(parseYmd(prevKey))}): ${prev.mi} mi in ${fmtMin(prev.min)} (${fmtMin(prev.min/prev.mi)}/mi)` : "";
  const goal = p.key==="tue"? (/bpm/.test(p.d)? `Keep your heart rate between ${HR_LO} and ${HR_HI}: jog slowly until it reaches ${HR_HI}, walk until it drops to ${HR_LO}, repeat. Pace doesn't matter.${/strides/.test(p.d)?" Finish with the strides: 15–20 s fast and relaxed (about 85%), walking 60–90 s between each.":""}` : /strides/.test(p.d)? "Keep the run/walk easy and conversational, then do the strides: 15–20 s smooth and fast (about 85%, not all-out), walk 60–90 s back between each." : "Cover a little more ground than last week in the same time.") : p.key==="thu"? "Hold each run segment a touch quicker than last week; keep the walks easy." : "Finish the distance. Pace doesn't matter; time on feet does.";
  return `<div class="card"><div class="row between"><div><div class="eyebrow">Run</div><h2>${esc(p.t)}</h2></div>${log?'<span class="chip run">Logged ✓</span>':""}</div>
    <div class="plan-box"><div style="font-weight:700">${esc(p.d)}</div><div class="small muted">${goal}</div></div>
    ${stravaChooser(k,log)}${timerBox(k)}${dayMenu(p,k,log)}
    ${prevTxt?`<div class="small num" style="color:var(--run);font-weight:600">${esc(prevTxt)}</div>`:""}
    <details class="logger" id="trainLog" ${openLogger?"open":""}><summary>${hasDraft(k,TRAIN_RE)?"Unsaved entries · tap to finish":log?`Logged: ${log.mi} mi · ${fmtMin(log.min)} · ${fmtMin(log.min/log.mi)}/mi`:"Log this run"}</summary><div class="stack" style="gap:10px;margin-top:12px">
    ${importerHtml(k)}
    <div class="row" style="align-items:flex-start">
      <div class="field"><label for="rmi">Distance (mi)</label><input id="rmi" inputmode="decimal" value="${esc(log?.mi??"")}" placeholder="e.g. 2.2"></div>
      <div class="field"><label for="rtime">Time (3000 = 30:00)</label><input id="rtime" inputmode="numeric" value="${log?.min?fmtMin(log.min):""}" placeholder="3000"></div>
      <div class="field"><label for="rrpe">Effort 1–10</label><input id="rrpe" inputmode="numeric" value="${esc(log?.rpe??"")}" placeholder="6"></div>
    </div>

function barChart(vals,labels,color,fmt,target){
  const W=320,H=150,L=34,B=20,T=10; const max=Math.max(1,target||0,...vals.map(v=>v||0)); const step=max>2000?2000:max>200?50:5; const nice=Math.ceil(max*1.05/step)*step||5;
  const bw=(W-L-6)/vals.length; let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  [0,.5,1].forEach(f=>{const y=T+(H-T-B)*(1-f); s+=`<line class="grid-line" x1="${L}" x2="${W}" y1="${y}" y2="${y}"/><text x="${L-4}" y="${y+3}" text-anchor="end">${fmt(nice*f)}</text>`});
  vals.forEach((v,i)=>{const x=L+i*bw+bw*.18, w=bw*.64, hgt=(H-T-B)*((v||0)/nice); const y=H-B-hgt;
    s+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(0,hgt)}" rx="2" fill="${color}"/>`;
    if(i%Math.ceil(vals.length/9)===0||i===vals.length-1) s+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`});
  if(target){const y=T+(H-T-B)*(1-target/nice); s+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${W-2}" y="${y-4}" text-anchor="end">target</text>`}
  return s+`</svg>`;
}
function lineChart(pts,color,fmt,invert){
  const W=320,H=150,L=36,B=20,T=12,Rt=10; const ys=pts.map(p=>p.y);
  if(!pts.length) return "";
  let lo=Math.min(...ys), hi=Math.max(...ys); if(lo===hi){lo-=1;hi+=1} const padv=(hi-lo)*.15; lo-=padv; hi+=padv;
  const X=i=>pts.length===1?(L+W-Rt)/2:L+i*(W-L-Rt)/(pts.length-1);
  const Y=v=>{const f=(v-lo)/(hi-lo); return T+(H-T-B)*(invert?f:1-f)};
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  [lo,(lo+hi)/2,hi].forEach(v=>{const y=Y(v); s+=`<line class="grid-line" x1="${L}" x2="${W-Rt}" y1="${y}" y2="${y}"/><text x="${L-4}" y="${y+3}" text-anchor="end">${fmt(v)}</text>`});
  const d=pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  if(pts.length>1) s+=`<path d="${d}L${X(pts.length-1).toFixed(1)},${H-B}L${X(0).toFixed(1)},${H-B}Z" fill="${color}" opacity=".08"/>`;
  s+=`<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  const every=Math.ceil(pts.length/7);
  pts.forEach((p,i)=>{const last=i===pts.length-1; s+=`<circle cx="${X(i)}" cy="${Y(p.y)}" r="${last?4.5:3}" fill="${last?color:"var(--surface)"}" stroke="${color}" stroke-width="2"/>`;
    if(i%every===0||last) s+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${esc(p.x)}</text>`});
  return s+`</svg>`;
}

/* ---------- Rule-based signals (free, instant) ---------- */
const PAINWORDS=/\b(pain|painful|hurt|hurts|hurting|ache|aching|sharp|injur|tweak|pull(ed)?|strain|shin|swollen|swelling|dizzy|lightheaded|faint)/i;
function signals(){
  const out=[], tk=ymd(today);
  const missed=[]; for(let n=7;n>=1;n--){const d=addDays(today,-n),p=planFor(d); if(p&&p.type!=="rest"&&!S.logs[ymd(d)]) missed.push(`${DOW[dowOf(d)]} ${p.type==="gym"?"gym":"run"}`)}
  const anyLogs=Object.keys(S.logs).length>0;
  if(anyLogs && missed.length) out.push({kind:"problem",title:`${missed.length} missed session${missed.length>1?"s":""} this past week`,detail:missed.join(", ")+".",action:"Pick back up with the next planned session. Don't double up."});
  const recentNotes=Object.entries(S.logs).filter(([k])=>k>=ymd(addDays(today,-14))).filter(([k,l])=>l.notes&&PAINWORDS.test(l.notes));
  if(recentNotes.length){const [k,l]=recentNotes[recentNotes.length-1]; out.push({kind:"problem",title:"Your notes mention pain",detail:`${fmtShort(parseYmd(k))}: "${l.notes.slice(0,90)}"`,action:"Sharp pain, swelling or dizziness means stop and get it checked. Dull soreness: ease the load."})}
  const stalls=[], wins=[];
  ALLEX.forEach(ex=>{const t=targetFor(ex,"9999-12-31"); if(t.stall) stalls.push(ex.name); const s=liftSeries(ex.id); if(s.length>=2&&s[s.length-1].y-s[0].y>=5) wins.push(`${ex.name} +${Math.round(s[s.length-1].y-s[0].y)} lb`)});
  if(stalls.length) out.push({kind:"problem",title:"Lifts stalling",detail:stalls.join(", ")+" didn't improve two sessions in a row.",action:"Take the 10% drop shown on Home, sleep 7+ hours, and eat your full plan."});
  if(wins.length) out.push({kind:"win",title:"Strength is climbing",detail:wins.slice(0,3).join(", ")+" (estimated 1-rep max).",action:"Keep the same rest times so the progress stays honest."});
  const wts=(S.profile.weights||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
  if(wts.length>=2){const days=Math.round((parseYmd(wts[wts.length-1].d)-parseYmd(wts[0].d))/DAYMS); if(days>=10){const rate=(wts[wts.length-1].lb-wts[0].lb)/(days/7);
    if(rate<-2.5) out.push({kind:"problem",title:"Weight dropping fast",detail:`${toUd(rate).toFixed(1)} ${uL()}/week. Faster than ~${UNIT()==="kg"?"1.1 kg":"2.5 lb"}/week risks losing muscle and stalling your runs.`,action:CUSTOM?"Add 200–300 kcal a day, mostly from carbs around your workouts.":"Add 200–300 kcal a day: extra ½ cup rice at lunch and a banana."});
    else if(rate>-0.3&&days>=14) out.push({kind:"opportunity",title:"Weight holding steady",detail:`${rate>0?"+":""}${toUd(rate).toFixed(1)} ${uL()}/week over ${days} days.`,action:CUSTOM?"Log everything you eat for a week so you can see where extra calories come from.":"Tick off every meal for a week so you can see where extra calories come from."});
    else if(rate<=-0.5) out.push({kind:"win",title:"Weight trending down",detail:`${toUd(rate).toFixed(1)} ${uL()}/week. Right in the useful range.`,action:"Keep weighing in every Monday morning."})}}
  let kd=0,ksum=0,psum=0,tsum=0; for(let n=1;n<=7;n++){const d=addDays(today,-n); if(!inProgram(d)) continue; const e=dayEaten(ymd(d)); if(e.any){kd++;ksum+=e.kcal;psum+=e.p;tsum+=dayTarget(d)}}
  if(kd>=3){const avg=ksum/kd, tavg=tsum/kd, pavg=psum/kd;
    if(avg<tavg-300) out.push({kind:"problem",title:"Eating under the plan",detail:`About ${fmtN(avg)} kcal/day logged vs ${fmtN(tavg)} planned.`,action:"Eat every planned meal, especially before long runs."});
    const pGoal=CUSTOM?foodGoals().p:140; if(pavg<pGoal*0.85) out.push({kind:"opportunity",title:"Protein running low",detail:`About ${Math.round(pavg)} g/day logged${CUSTOM?` vs your ${pGoal} g goal`:""}.`,action:CUSTOM?"Add a protein source to every meal: chicken, eggs, Greek yogurt, cottage cheese or a shake.":"Don't skip the cottage cheese snack or the run-day eggs."});}
  const hardEasy=Object.entries(S.logs).filter(([k,l])=>k>=ymd(addDays(today,-14))&&l.type==="run"&&l.key==="tue"&&Number(l.rpe)>=8);
  if(hardEasy.length) out.push({kind:"opportunity",title:"Easy runs feel hard",detail:`Effort ${hardEasy.map(([k,l])=>l.rpe).join(", ")}/10 on easy runs.`,action:"Slow the run segments down until you could talk in full sentences."});
  const hot=Object.entries(S.logs).filter(([k,l])=>k>=ymd(addDays(today,-14))&&l.type==="run"&&isHrRun(k)&&l.st&&l.st.series).map(([k,l])=>[k,hrRange(l.st.series)]).filter(([k,r])=>r&&r.pctAbove>30);
  if(hot.length){const [hk,hr]=hot[hot.length-1]; out.push({kind:"opportunity",title:`Easy run drifted above ${HR_HI}`,detail:`${fmtShort(parseYmd(hk))}: ${Math.round(hr.pctAbove)}% of the run above ${HR_HI} bpm, ${Math.round(hr.pctIn)}% in range.`,action:`Start walking as soon as you hit ${HR_HI}, and jog slower.`})}
  const easy=Object.entries(S.logs).filter(([k,l])=>l.type==="run"&&l.key==="tue"&&l.mi&&l.min).sort((a,b)=>a[0]<b[0]?-1:1).map(([k,l])=>l.min/l.mi);
  if(easy.length>=2&&easy[easy.length-1]<easy[0]-0.15) out.push({kind:"win",title:"Easy pace improving",detail:`${fmtMin(easy[0])}/mi → ${fmtMin(easy[easy.length-1])}/mi on easy runs.`,action:"Keep easy runs easy; the speed comes from consistency."});
  const order={problem:0,opportunity:1,win:2};
  return out.sort((a,b)=>order[a.kind]-order[b.kind]);
}

function buildRuns(su,W){

document.addEventListener("click",e=>{ const b=e.target.closest&&e.target.closest("[data-su-edit]"); if(!b) return; setupOpen=true; SUW=null; render(); window.scrollTo(0,0) });

// A home-screen app can stay open overnight: start fresh when the date changes.
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && ymd(new Date())!==ymd(today)) location.reload() });
boot(); tick(); if(TM.start) keepAwake(true);
</script>
